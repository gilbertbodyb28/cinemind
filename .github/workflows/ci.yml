name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test --watchAll=false --runInBand
      - run: yarn build

  backend:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: cinemind_ci
      CORS_ORIGINS: http://localhost:3000
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            deploy/nas/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r deploy/nas/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest backend/recommendation_tests backend/evaluation_tests -q
      - run: python -m compileall -q backend

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/check_vision_ui_lock.py
      - run: git diff --check
      - run: test -s LICENSE
      - run: test -s README.md
      - run: test -s CONTRIBUTING.md
      - run: test -s SECURITY.md
